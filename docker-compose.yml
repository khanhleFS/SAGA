version: '3.8'

services:
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: saga-inventory-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
    networks:
      - saga-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: saga-payment-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
    networks:
      - saga-network

  order-orchestrator:
    build:
      context: .
      dockerfile: order-orchestrator/Dockerfile
    container_name: saga-order-orchestrator
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8083
    depends_on:
      - inventory-service
      - payment-service
    networks:
      - saga-network

networks:
  saga-network:
    driver: bridge

